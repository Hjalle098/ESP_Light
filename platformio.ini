[env:esp32-c6-devkitc-1]
; Use the pioarduino fork — tracks current Arduino-ESP32 cores (3.x) that support the C6.
; The official platformio/espressif32 lagged and ships a 2.x core that has no C6 support.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Route Serial (prints AND keyboard input) to the C6's native USB port.
; Without this, Serial uses UART0 on the GPIO header, so the USB monitor
; shows nothing and HomeSpan can't receive the 'W' WiFi-setup command.
; USB_MODE=1 selects the C6's HW USB-Serial/JTAG (it has no USB-OTG).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    ; Native HomeKit (HAP) implementation — no bridge/hub needed.
    ; Pinned to 2.1.5: last HomeSpan that builds on Arduino-ESP32 3.1.x (the
    ; core the pioarduino platform above ships). 2.1.6 calls WiFi.getBand()
    ; and 2.1.7+ hard-require core 3.3.0 — both need a newer platform.
    https://github.com/HomeSpan/HomeSpan.git#2.1.5

; HomeSpan + WiFi + NeoPixel can exceed the default app partition.
; Give the firmware more room so the build doesn't overflow.
board_build.partitions = huge_app.csv